<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>flowers</title>
<style>body{margin:0;background:#000;overflow:hidden}canvas{display:block}#t{position:fixed;bottom:20px;width:100%;text-align:center;color:#fff6;font:12px monospace;pointer-events:none}</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="t">TOCA LA PANTALLA</div>
<script>
let c=document.getElementById('c'), x=c.getContext('2d');
function size(){ c.width=innerWidth; c.height=innerHeight; }
size(); addEventListener('resize',size);
let fl=[];
let colors=[["#ffafcc","#ffb3c6"],["#ff4d6d","#ff758f"],["#ff0000","#e5383b"],["#ffbe0b","#fb5607"],["#fff","#dee2e6"],["#fff","#caffbf"]];
function add(X,Y){
 document.getElementById('t').style.display='none';
 let id=fl.length%colors.length;
 fl.push({x:X,y:Y,c:colors[id],p:[5,6,12,16,6,10][id],r:0,g:0,a:Math.random()*6});
}
function draw(){
 x.fillStyle='rgba(0,0,0,0.25)'; x.fillRect(0,0,c.width,c.height);
 fl.forEach(f=>{
  if(f.g<1)f.g+=0.03;
  f.r=16*f.g; f.a+=0.01;
  x.save(); x.translate(f.x,f.y); x.translate(Math.sin(f.a)*4,40);
  for(let i=0;i<f.p;i++){
   x.save(); x.rotate(i/f.p*Math.PI*2);
   x.fillStyle=f.c[i%2];
   x.beginPath(); x.ellipse(0,-f.r*0.7,f.r*0.4,f.r*0.7,0,0,Math.PI*2); x.fill();
   x.restore();
  }
  x.beginPath(); x.arc(0,0,f.r*0.3,0,7); x.fillStyle='#ffbe0b'; x.fill();
  x.restore();
 });
 requestAnimationFrame(draw);
}
draw();
c.addEventListener('touchstart',e=>{e.preventDefault();add(e.touches[0].clientX,e.touches[0].clientY)},{passive:false});
c.addEventListener('click',e=>add(e.clientX,e.clientY));
setTimeout(()=>add(innerWidth/2,innerHeight/2),500);
</script>
</body>
</html>
