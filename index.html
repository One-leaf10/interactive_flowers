<title>Flowers</title>
<style>
  *{margin:0;padding:0}
  body{background:#0a0a0f;overflow:hidden;touch-action:none}
  canvas{position:fixed;top:0;left:0;width:100%;height:100%}
  #t{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);color:#ffffff88;font-size:12px;letter-spacing:2px;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="t">TOCA PARA FLORECER</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = canvas.width = window.innerWidth;
let H = canvas.height = window.innerHeight;
window.addEventListener('resize',()=>{ W=canvas.width=innerWidth; H=canvas.height=innerHeight; });

const TYPES = [
  {p:5, c:['#ffafcc','#ffb3c6'], s:'round'},
  {p:6, c:['#ff4d6d','#ff758f'], s:'cup'},
  {p:12, c:['#e5383b','#ff0000'], s:'round'},
  {p:16, c:['#ffbe0b','#fb5607'], s:'point'},
  {p:6, c:['#ffffff','#dee2e6'], s:'long'},
  {p:10, c:['#ffffff','#caffbf'], s:'long'}
];
let flowers=[];

function Flower(x,y,i){
  this.x=x; this.y=y; this.type=TYPES[i % TYPES.length];
  this.r=0; this.maxR=16; this.g=0; this.a=Math.random()*6;
}
Flower.prototype.draw=function(){
  if(this.g<1) this.g+=0.02;
  this.r = this.maxR * this.g;
  this.a+=0.005;
  ctx.save();
  ctx.translate(this.x, this.y);
  // tallo
  ctx.strokeStyle='rgba(100,180,100,0.5)';
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.lineTo(Math.sin(this.a)*5, 40);
  ctx.stroke();
  ctx.translate(Math.sin(this.a)*5, 40);
  // petalos
  for(let k=0;k<this.type.p;k++){
    ctx.save();
    ctx.rotate((k/this.type.p)*Math.PI*2);
    ctx.fillStyle=this.type.c[k%2];
    ctx.beginPath();
    if(this.type.s==='round'){
      ctx.ellipse(0,-this.r*0.7, this.r*0.45, this.r*0.75, 0,0,Math.PI*2);
    } else if(this.type.s==='cup'){
      ctx.ellipse(0,-this.r*0.6, this.r*0.35, this.r*0.7, 0,0,Math.PI*2);
    } else if(this.type.s==='point'){
      ctx.moveTo(0,0); ctx.quadraticCurveTo(this.r*0.3, -this.r*0.6, 0, -this.r); ctx.quadraticCurveTo(-this.r*0.3, -this.r*0.6, 0,0);
    } else {
      ctx.ellipse(0,-this.r*0.8, this.r*0.25, this.r*0.9, 0,0,Math.PI*2);
    }
    ctx.fill();
    ctx.restore();
  }
  ctx.beginPath(); ctx.arc(0,0,this.r*0.25,0,Math.PI*2); ctx.fillStyle='#ffbe0b'; ctx.fill();
  ctx.restore();
};
